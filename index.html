<!DOCTYPE html>
<html lang="es-CL" data-tema="oscuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prospector</title>
<meta name="description" content="Tablero de demos y prospectos de Yordy Serna. Uso interno.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0F14">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icono-192.png">
<!-- Fuentes self-hosteadas con demos/self-hostear-fuentes.ps1 (86 KB en total): la app anda sin internet -->
<link rel="preload" href="assets/fuentes/manrope-var-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/fuentes.css">
<link rel="stylesheet" href="css/app.css?v=1788689299">
</head>
<body>
<div class="app" id="app">

  <aside class="lateral" id="lateral">
    <div class="marca">
      <img src="assets/icono.svg" alt="" width="38" height="38">
      <div class="marca-texto"><strong>Prospector</strong><span>demos y prospectos</span></div>
    </div>
    <div class="usuario" title="Quién está usando la app: cada llamada, WhatsApp y nota se anota a su nombre">
      <span>Soy</span>
      <div class="segmento"><button type="button" data-usuario="Yordy">Yordy</button><button type="button" data-usuario="Guillermo">Guillermo</button></div>
    </div>

    <nav class="nav" aria-label="Secciones">
      <button class="nav-item activo" data-vista="hoy" type="button">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
        <span>Hoy</span><b class="cuenta" data-cuenta="hoy"></b>
      </button>
      <button class="nav-item" data-vista="demos" type="button">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 9h18M8 22h8"/></svg>
        <span>Demos</span><b class="cuenta" data-cuenta="demos"></b>
      </button>
      <button class="nav-item" data-vista="prospectos" type="button">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/><circle cx="18" cy="17" r="3"/><path d="m20.5 19.5 2 2"/></svg>
        <span>Prospectos</span><b class="cuenta" data-cuenta="prospectos"></b>
      </button>
      <button class="nav-item" data-vista="pipeline" type="button">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="9.5" y="4" width="5" height="10" rx="1"/><rect x="16" y="4" width="5" height="13" rx="1"/></svg>
        <span>Pipeline</span><b class="cuenta" data-cuenta="pipeline"></b>
      </button>
      <button class="nav-item" data-vista="clientes" type="button">
        <svg viewBox="0 0 24 24"><path d="M3 21V9l9-6 9 6v12"/><path d="M9 21v-6h6v6"/></svg>
        <span>Clientes</span><b class="cuenta" data-cuenta="clientes"></b>
      </button>
      <button class="nav-item" data-vista="stats" type="button">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Estadísticas</span>
      </button>
      <button class="nav-item" data-vista="ajustes" type="button">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>Ajustes</span>
      </button>
    </nav>

    <div class="lateral-pie">
      <div class="conexion" id="conexion"><i></i><span>Conectando…</span></div>
      <button class="btn btn-fantasma btn-bloque" id="btn-actualizar" type="button">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
        Actualizar inventario
      </button>
      <div class="lateral-fila">
        <button class="btn-icono" id="btn-tema" type="button" title="Cambiar tema (t)"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
        <button class="btn-icono" id="btn-instalar" type="button" title="Instalar como app" hidden><svg viewBox="0 0 24 24"><path d="M12 3v12M6 9l6 6 6-6M4 21h16"/></svg></button>
        <span class="version">v1.0 · 02-09-2026</span>
      </div>
    </div>
  </aside>

  <main class="principal" id="principal">
    <header class="barra">
      <button class="btn-icono solo-movil" id="btn-menu" type="button" aria-label="Menú"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1 class="barra-titulo" id="titulo-vista">Hoy</h1>
      <label class="buscador">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="buscar" type="search" placeholder="Buscar negocio, rubro, ciudad, teléfono…" autocomplete="off" spellcheck="false">
        <kbd>/</kbd>
      </label>
      <div class="barra-acciones" id="barra-acciones"></div>
    </header>
    <div class="aviso" id="aviso" hidden></div>

    <section class="vista" id="vista-hoy"></section>
    <section class="vista" id="vista-demos" hidden></section>
    <section class="vista" id="vista-prospectos" hidden></section>
    <section class="vista" id="vista-pipeline" hidden></section>
    <section class="vista" id="vista-clientes" hidden></section>
    <section class="vista" id="vista-stats" hidden></section>
    <section class="vista" id="vista-ajustes" hidden></section>
  </main>

  <aside class="ficha" id="ficha" aria-label="Ficha del negocio" hidden></aside>
  <div class="velo" id="velo" hidden></div>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <header class="modal-cab">
      <span id="modal-titulo"></span>
      <div class="modal-botones">
        <button class="btn-chico" id="modal-vista" type="button">Ver en móvil</button>
        <a class="btn-chico" id="modal-nueva" href="#" target="_blank" rel="noopener">Abrir en pestaña ↗</a>
        <button class="btn-icono" id="modal-cerrar" type="button" aria-label="Cerrar">✕</button>
      </div>
    </header>
    <div class="modal-marco" id="modal-marco"><iframe id="modal-iframe" title="Vista previa de la demo"></iframe></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<!-- Sin servidor (file:// o GitHub Pages), app.js carga datos/demos.js por su cuenta -->
<script>window.PROSPECTOR_BOVEDA_URL = 'datos.enc?v=1788689299';</script>
<script src="js/boveda.js?v=1788689299"></script>
<script src="js/app.js?v=1788689299"></script>
</body>
</html>
